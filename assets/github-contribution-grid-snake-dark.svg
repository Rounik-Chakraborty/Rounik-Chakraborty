<svg width="800" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="snakeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes crawlSnake {
      0% { transform: translate(40px, 40px); }
      25% { transform: translate(240px, 40px); }
      35% { transform: translate(240px, 80px); }
      60% { transform: translate(520px, 80px); }
      75% { transform: translate(520px, 120px); }
      100% { transform: translate(720px, 120px); }
    }

    .snake-head {
      animation: crawlSnake 8s linear infinite;
    }

    .tile-glow {
      animation: tilePulse 2s ease-in-out infinite alternate;
    }

    @keyframes tilePulse {
      0% { fill-opacity: 0.7; }
      100% { fill-opacity: 1; filter: drop-shadow(0 0 4px #A855F7); }
    }
  </style>

  <rect width="800" height="160" rx="10" fill="#050505" stroke="#2A0A4A" stroke-width="1.2" />

