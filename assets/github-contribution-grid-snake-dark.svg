    <rect x="-24" y="0" width="12" height="12" rx="3" fill="#8B5CF6" opacity="0.8" />
    <rect x="-12" y="0" width="12" height="12" rx="3" fill="#A855F7" opacity="0.9" />
    <!-- Snake Head -->
