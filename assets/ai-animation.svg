<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="200" rx="12" fill="#050505" stroke="#2A0A4A" stroke-width="1.5" />
  <circle cx="200" cy="100" r="90" fill="url(#aiGlow)" />

  <!-- Neural Layers -->
  <!-- Layer 1 (Input) -->
  <g fill="#A855F7" filter="url(#nodeGlow)">
    <circle cx="80" cy="50" r="6" />
    <circle cx="80" cy="100" r="6" />
    <circle cx="80" cy="150" r="6" />
  </g>

  <!-- Layer 2 (Hidden) -->
  <g fill="#8B5CF6" filter="url(#nodeGlow)">
    <circle cx="200" cy="40" r="7" />
    <circle cx="200" cy="80" r="7" />
    <circle cx="200" cy="120" r="7" />
    <circle cx="200" cy="160" r="7" />
  </g>

  <!-- Layer 3 (Output) -->
  <g fill="#C4B5FD" filter="url(#nodeGlow)">
    <circle cx="320" cy="70" r="6" />
    <circle cx="320" cy="130" r="6" />
  </g>

  <!-- Synapses / Connections -->
  <g stroke="#6D28D9" stroke-width="1.2" stroke-opacity="0.4">
    <!-- L1 to L2 -->
    <line x1="80" y1="50" x2="200" y2="40" />
    <line x1="80" y1="50" x2="200" y2="80" />
    <line x1="80" y1="50" x2="200" y2="120" />
    <line x1="80" y1="100" x2="200" y2="40" />
    <line x1="80" y1="100" x2="200" y2="80" />
    <line x1="80" y1="100" x2="200" y2="120" />
    <line x1="80" y1="100" x2="200" y2="160" />
    <line x1="80" y1="150" x2="200" y2="80" />
    <line x1="80" y1="150" x2="200" y2="120" />
    <line x1="80" y1="150" x2="200" y2="160" />

    <!-- L2 to L3 -->
    <line x1="200" y1="40" x2="320" y2="70" />
    <line x1="200" y1="80" x2="320" y2="70" />
    <line x1="200" y1="120" x2="320" y2="70" />
    <line x1="200" y1="80" x2="320" y2="130" />
    <line x1="200" y1="120" x2="320" y2="130" />
    <line x1="200" y1="160" x2="320" y2="130" />
  </g>

  <!-- High-tech text label -->
  <text x="200" y="185" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#8B5CF6" letter-spacing="2">
    NEURAL CORE // ACTIVE
  </text>
</svg>
