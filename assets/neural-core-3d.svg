<svg width="450" height="300" viewBox="0 0 450 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#6D28D9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <filter id="intenseGlow3D" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1" />
      <feGaussianBlur stdDeviation="2" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyberRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes spin3DInner {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes spin3DOuter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulseCore {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes orbit3D {
      0% { transform: rotate(0deg) translateX(85px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(85px) rotate(-360deg); }
    }

    @keyframes orbit3D2 {
      0% { transform: rotate(180deg) translateX(110px) rotate(-180deg); }
      100% { transform: rotate(540deg) translateX(110px) rotate(-540deg); }
    }

    .rot-inner {
      transform-origin: 225px 140px;
      animation: spin3DInner 10s ease-in-out infinite;
    }

    .rot-outer {
      transform-origin: 225px 140px;
      animation: spin3DOuter 14s linear infinite;
    }

    .pulsing-sphere {
      transform-origin: 225px 140px;
      animation: pulseCore 3.5s ease-in-out infinite;
    }

    .satellite-node-1 {
      transform-origin: 225px 140px;
      animation: orbit3D 5s linear infinite;
    }

    .satellite-node-2 {
      transform-origin: 225px 140px;
      animation: orbit3D2 8s linear infinite;
    }

    .mono-hud {
      font-family: 'Fira Code', 'Courier New', monospace;
      letter-spacing: 2px;
    }
  </style>

  <!-- Container Box -->
  <rect width="450" height="300" rx="14" fill="#050505" stroke="#2A0A4A" stroke-width="1.5" />

  <!-- Center Aura -->
  <circle cx="225" cy="140" r="110" fill="url(#coreAura)" />

  <!-- Outer Orbiting Ring 3D -->
  <g class="rot-outer" opacity="0.65">
    <ellipse cx="225" cy="140" rx="115" ry="48" fill="none" stroke="url(#cyberRing)" stroke-width="1.5" stroke-dasharray="16 12 4 12" filter="url(#intenseGlow3D)" />
  </g>

  <!-- Inner Orbiting Ring 3D -->
  <g class="rot-inner" opacity="0.8">
    <ellipse cx="225" cy="140" rx="85" ry="36" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="24 8" filter="url(#intenseGlow3D)" />
  </g>

  <!-- 3D Geometric Neural Core Structure -->
  <g class="pulsing-sphere" filter="url(#intenseGlow3D)">
    <!-- Polyhedron Edges -->
    <polygon points="225,90 265,115 265,165 225,190 185,165 185,115" fill="#2A0A4A" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="1.5" />
    <line x1="225" y1="90" x2="225" y2="190" stroke="#A855F7" stroke-width="1.2" />
    <line x1="185" y1="115" x2="265" y2="165" stroke="#8B5CF6" stroke-width="1.2" />
    <line x1="185" y1="165" x2="265" y2="115" stroke="#8B5CF6" stroke-width="1.2" />

    <!-- Center Energy Sphere -->
    <circle cx="225" cy="140" r="22" fill="#6D28D9" fill-opacity="0.8" />
    <circle cx="225" cy="140" r="12" fill="#F5F3FF" />

    <!-- Vertex Glowing Nodes -->
    <circle cx="225" cy="90" r="4" fill="#C4B5FD" />
    <circle cx="265" cy="115" r="4" fill="#C4B5FD" />
    <circle cx="265" cy="165" r="4" fill="#C4B5FD" />
    <circle cx="225" cy="190" r="4" fill="#C4B5FD" />
    <circle cx="185" cy="165" r="4" fill="#C4B5FD" />
    <circle cx="185" cy="115" r="4" fill="#C4B5FD" />
  </g>

  <!-- Orbiting Satellites -->
  <circle cx="225" cy="140" r="4.5" fill="#F5F3FF" filter="url(#intenseGlow3D)" class="satellite-node-1" />
  <circle cx="225" cy="140" r="3.5" fill="#A855F7" filter="url(#intenseGlow3D)" class="satellite-node-2" />

  <!-- Bottom Telemetry Card Bar -->
  <g transform="translate(225, 260)">
    <rect x="-160" y="-12" width="320" height="24" rx="6" fill="#0D0D0D" stroke="#2A0A4A" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" class="mono-hud" font-size="10" fill="#8B5CF6">
      3D NEURAL MATRIX // SYNCHRONIZED
    </text>
  </g>

  <!-- HUD Corner Accents -->
  <path d="M 16 32 L 16 16 L 32 16" stroke="#8B5CF6" stroke-width="1.5" fill="none" />
  <path d="M 434 32 L 434 16 L 418 16" stroke="#8B5CF6" stroke-width="1.5" fill="none" />
  <path d="M 16 268 L 16 284 L 32 284" stroke="#8B5CF6" stroke-width="1.5" fill="none" />
  <path d="M 434 268 L 434 284 L 418 284" stroke="#8B5CF6" stroke-width="1.5" fill="none" />
</svg>
